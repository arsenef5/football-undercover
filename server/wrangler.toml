# Serveur de salons du mode en ligne. Un salon = un Durable Object, nommé par son code.
# Développement local : npx wrangler dev  (aucun compte Cloudflare nécessaire)
# Mise en ligne     : npx wrangler deploy (là, il faut le compte d'Arsène)
name = "football-undercover-salons"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite : indispensable pour que les Durable Objects marchent sur le palier gratuit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
