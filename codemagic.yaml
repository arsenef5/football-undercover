# Compilation dans le cloud (codemagic.io) : iOS vers TestFlight, Android en AAB.
# Prérequis côté Codemagic : intégration App Store Connect nommée "app_store_connect"
# (Teams > Integrations) et, pour Android, un keystore chargé dans "Code signing identities".

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.footballundercover.app
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Dépendances web
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Synchroniser le projet iOS
        script: npx cap sync ios
      - name: Numéro de build
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Profils de signature
        script: xcode-project use-profiles
      - name: Archive
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-aab:
    name: Android → AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - football_undercover_keystore
      node: 20
      java: 17
    scripts:
      - name: Dépendances web
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Synchroniser le projet Android
        script: npx cap sync android
      - name: Bundle signé
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
